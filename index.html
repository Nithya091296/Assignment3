<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Form</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f1f5f9;
      font-family: Arial, sans-serif;
    }

    .login-box {
      width: 350px;
      padding: 30px;
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
    }

    h2 {
      text-align: center;
      color: #164a7a;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 18px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 15px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 5px;
      background: #164a7a;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #0d3458;
    }
  </style>

</head>

<body>

  <div class="login-box">

```
<h2>Login</h2>

<form action="https://formspree.io/f/xvkokrn" method="POST">

  <label for="inp1">inp1</label>
  <input
    type="text"
    id="inp1"
    name="inp1"
    placeholder="Enter inp1"
    required
  >

  <label for="inp2">inp2</label>
  <input
    type="text"
    id="inp2"
    name="inp2"
    placeholder="Enter inp2"
    required
  >

  <button type="submit">Login</button>

</form>
```

  </div>

</body>
</html>
